
name: First CI Pipeline

on:
  push:
    branches:
      - main
      - feature/first-github-action

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Python version
        run: python --version

      - name: Run automated tests
        run: python -m unittest discover -s ci-lab -p 'test_*.py' -v
